<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874" style="background-color: #F1F3F2; font-family: 'Noto Sans KR', sans-serif;">
  <defs>
    <!-- 그림자 효과 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <!-- 팝업 모달 그림자 -->
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- [바탕 화면: 수강 과목 편집 레이아웃] -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#F1F3F2"/>

  <!-- 상단 헤더 -->
  <g transform="translate(20, 28)">
    <path d="M4 14 L12 6 M4 14 L12 22" stroke="#121714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="20" font-size="18" font-weight="800" fill="#0C6B3F">수강 과목 편집</text>
  </g>

  <!-- 메인 콘텐츠 그룹 카드 -->
  <g transform="translate(20, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="362" height="760" rx="22" fill="#FFFFFF"/>

    <!-- 1. 학기 및 총 학점 요약 박스 -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="326" height="54" rx="14" fill="#E9F3EE"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#656E69">2026학년도 2학기</text>
      <text x="16" y="42" font-size="14" font-weight="800" fill="#121714">현재 수강 등록: <tspan fill="#0C6B3F">총 4과목 (12학점)</tspan></text>
    </g>

    <!-- 2. 과목 검색 & 추가 영역 -->
    <g transform="translate(18, 86)">
      <rect x="0" y="0" width="242" height="42" rx="12" fill="#F1F3F2"/>
      <text x="14" y="26" font-size="13" fill="#121714" font-weight="700">모바일앱디자인 (DS0201)</text>
      
      <!-- 추가 버튼 -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="76" height="42" rx="12" fill="#0C6B3F"/>
        <text x="38" y="26" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">+ 추가</text>
      </g>
    </g>

    <!-- 구분선 -->
    <line x1="18" y1="144" x2="344" y2="144" stroke="#F1F3F2" stroke-width="1.5"/>

    <!-- 3. 수강 과목 목록 -->
    <g transform="translate(18, 156)">
      <text x="0" y="16" font-size="14" font-weight="800" fill="#121714">수강 과목 목록</text>

      <!-- 과목 1 -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="326" height="92" rx="14" fill="#F1F3F2"/>
        <rect x="12" y="12" width="34" height="20" rx="6" fill="#E9F3EE"/>
        <text x="29" y="26" font-size="10" font-weight="800" fill="#0C6B3F" text-anchor="middle">전필</text>
        <text x="52" y="27" font-size="14" font-weight="800" fill="#121714">캡스톤디자인 II</text>
        <text x="210" y="27" font-size="11" font-weight="600" fill="#656E69">3학점 · CS0401</text>
        <text x="12" y="52" font-size="12" font-weight="600" fill="#121714">월 02,03 / 수 01</text>
        <text x="12" y="70" font-size="11" fill="#656E69">담당교수: 김서경 교수님</text>
      </g>

      <!-- 과목 2 -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="326" height="92" rx="14" fill="#F1F3F2"/>
        <rect x="12" y="12" width="34" height="20" rx="6" fill="#E9F3EE"/>
        <text x="29" y="26" font-size="10" font-weight="800" fill="#0C6B3F" text-anchor="middle">전선</text>
        <text x="52" y="27" font-size="14" font-weight="800" fill="#121714">인공지능개론</text>
        <text x="210" y="27" font-size="11" font-weight="600" fill="#656E69">3학점 · CS0312</text>
        <text x="12" y="52" font-size="12" font-weight="600" fill="#121714">화 04,05 / 목 04</text>
        <text x="12" y="70" font-size="11" fill="#656E69">담당교수: 이박사 교수님</text>
      </g>
    </g>

    <!-- 하단 저장 버튼 -->
    <g transform="translate(18, 688)">
      <rect x="0" y="0" width="326" height="52" rx="16" fill="#0C6B3F"/>
      <text x="163" y="31" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">수강 과목 변경사항 저장하기</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- [4] 등록 불가 경고 팝업 모달 (Modal Layer) -->
  <!-- ========================================== -->

  <!-- 1. 반투명 배경 오버레이 (Dim Overlay) -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#121714" fill-opacity="0.48"/>

  <!-- 2. 중앙 팝업 카키/흰색 카드 -->
  <g transform="translate(36, 280)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="330" height="280" rx="24" fill="#FFFFFF"/>

    <!-- 경고 서클 아이콘 (Alert #B93C0A) -->
    <g transform="translate(165, 38)">
      <circle cx="0" cy="0" r="26" fill="#FFF1E6"/>
      <circle cx="0" cy="0" r="20" fill="#B93C0A"/>
      <!-- 느낌표 아이콘 -->
      <path d="M0 -8 V2 M0 7 V9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 팝업 제목 -->
    <text x="165" y="96" font-size="18" font-weight="800" fill="#121714" text-anchor="middle">수강 과목 등록 불가</text>

    <!-- 사유 및 상세 설명 박스 -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="290" height="80" rx="14" fill="#FFF1E6"/>
      
      <!-- 중복 강의 정보 안내 -->
      <text x="145" y="28" font-size="13" font-weight="800" fill="#B93C0A" text-anchor="middle">⚠️ 강의 시간 중복 (금요일 05교시)</text>
      <text x="145" y="48" font-size="12" font-weight="600" fill="#121714" text-anchor="middle">기존 수강 과목 <tspan fill="#0C6B3F">[서경인성리더십]</tspan>과</text>
      <text x="145" y="66" font-size="12" font-weight="600" fill="#121714" text-anchor="middle">수업 시간대가 서로 겹칩니다.</text>
    </g>

    <!-- [확인] 닫기 버튼 -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="290" height="48" rx="14" fill="#B93C0A"/>
      <text x="145" y="29" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">확인</text>
    </g>
  </g>

  <!-- 하단 홈 제스처 바 -->
  <rect x="136" y="860" width="130" height="4" rx="2" fill="#121714"/>
</svg>
