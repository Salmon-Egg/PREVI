<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874" style="background-color: #F1F3F2; font-family: 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- [바탕 화면: 기존 수강 과목 편집 레이아웃] -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#F1F3F2"/>

  <!-- 상단 헤더 -->
  <g transform="translate(20, 28)">
    <path d="M4 14 L12 6 M4 14 L12 22" stroke="#121714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="20" font-size="18" font-weight="800" fill="#0C6B3F">수강 과목 편집</text>
  </g>

  <!-- 메인 콘텐츠 카드 -->
  <g transform="translate(20, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="362" height="760" rx="22" fill="#FFFFFF"/>

    <!-- 학기 요약 박스 -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="326" height="54" rx="14" fill="#E9F3EE"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#656E69">2026학년도 2학기</text>
      <text x="16" y="42" font-size="14" font-weight="800" fill="#121714">현재 수강 등록: <tspan fill="#0C6B3F">총 4과목 (12학점)</tspan></text>
    </g>

    <!-- 과목 추가 버튼 -->
    <g transform="translate(18, 86)">
      <rect x="0" y="0" width="326" height="44" rx="12" fill="#0C6B3F"/>
      <text x="163" y="27" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">+ 과목 추가하기</text>
    </g>

    <line x1="18" y1="146" x2="344" y2="146" stroke="#F1F3F2" stroke-width="1.5"/>

    <!-- 수강 과목 목록 -->
    <g transform="translate(18, 158)">
      <text x="0" y="16" font-size="14" font-weight="800" fill="#121714">수강 과목 목록</text>
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="326" height="92" rx="14" fill="#F1F3F2"/>
        <rect x="12" y="12" width="34" height="20" rx="6" fill="#E9F3EE"/>
        <text x="29" y="26" font-size="10" font-weight="800" fill="#0C6B3F" text-anchor="middle">전필</text>
        <text x="52" y="27" font-size="14" font-weight="800" fill="#121714">캡스톤디자인 II</text>
        <text x="210" y="27" font-size="11" font-weight="600" fill="#656E69">3학점 · CS0401</text>
        <text x="12" y="52" font-size="12" font-weight="600" fill="#121714">월 02,03 / 수 01</text>
        <text x="12" y="70" font-size="11" fill="#656E69">담당교수: 김서경 교수님</text>
      </g>
    </g>

    <g transform="translate(18, 688)">
      <rect x="0" y="0" width="326" height="52" rx="16" fill="#0C6B3F"/>
      <text x="163" y="31" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">수강 과목 변경사항 저장하기</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- [3] 직접 입력으로 추가 팝업 모달 -->
  <!-- ========================================== -->

  <!-- 반투명 배경 (Dim Overlay) -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#121714" fill-opacity="0.48"/>

  <!-- 직접 입력 팝업 카드 모달 -->
  <g transform="translate(28, 180)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="346" height="490" rx="24" fill="#FFFFFF"/>

    <!-- 모달 타이틀 & 닫기 버튼 -->
    <text x="20" y="38" font-size="18" font-weight="800" fill="#121714">직접 입력으로 추가</text>
    <text x="316" y="36" font-size="18" font-weight="700" fill="#656E69" text-anchor="middle">✕</text>

    <!-- 입력 폼 1: 과목명 -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#121714">과목명 *</text>
      <rect x="0" y="22" width="306" height="42" rx="10" fill="#F1F3F2" stroke="#E9F3EE" stroke-width="1.2"/>
      <text x="14" y="48" font-size="13" fill="#121714">모바일 앱 프로그래밍</text>
    </g>

    <!-- 입력 폼 2: 과목 구분 (전공 / 교양 선택 칩) -->
    <g transform="translate(20, 138)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#121714">과목 구분 *</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="148" height="38" rx="10" fill="#E9F3EE" stroke="#0C6B3F" stroke-width="1.5"/>
        <text x="74" y="24" font-size="13" font-weight="800" fill="#0C6B3F" text-anchor="middle">전공</text>

        <rect x="158" y="0" width="148" height="38" rx="10" fill="#F1F3F2"/>
        <text x="232" y="24" font-size="13" font-weight="600" fill="#656E69" text-anchor="middle">교양</text>
      </g>
    </g>

    <!-- 입력 폼 3: 수강 요일 및 교시 -->
    <g transform="translate(20, 218)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#121714">수업 시간 및 요일 *</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="90" height="42" rx="10" fill="#F1F3F2"/>
        <text x="45" y="26" font-size="13" font-weight="700" fill="#121714" text-anchor="middle">금요일 ▾</text>

        <rect x="98" y="0" width="208" height="42" rx="10" fill="#F1F3F2"/>
        <text x="112" y="26" font-size="13" fill="#121714">02, 03, 04 교시 (10:00~13:00)</text>
      </g>
    </g>

    <!-- 입력 폼 4: 강의실 & 교수명 -->
    <g transform="translate(20, 300)">
      <g transform="translate(0, 0)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#121714">강의실</text>
        <rect x="0" y="22" width="146" height="42" rx="10" fill="#F1F3F2"/>
        <text x="14" y="48" font-size="13" fill="#121714">유담관 502호</text>
      </g>
      
      <g transform="translate(156, 0)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#121714">교수명</text>
        <rect x="0" y="22" width="150" height="42" rx="10" fill="#F1F3F2"/>
        <text x="14" y="48" font-size="13" fill="#121714">박서경 교수님</text>
      </g>
    </g>

    <!-- [시간표에 추가하기] 버튼 -->
    <g transform="translate(20, 412)">
      <rect x="0" y="0" width="306" height="50" rx="14" fill="#0C6B3F"/>
      <text x="153" y="30" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">시간표에 추가하기</text>
    </g>
  </g>

  <!-- 하단 홈 제스처 바 -->
  <rect x="136" y="860" width="130" height="4" rx="2" fill="#121714"/>
</svg>
