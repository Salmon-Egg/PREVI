<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874" style="background-color: #F1F3F2; font-family: 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- [바탕 화면: 수강 과목 편집 레이아웃] -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#F1F3F2"/>

  <!-- 상단 헤더 -->
  <g transform="translate(20, 28)">
    <path d="M4 14 L12 6 M4 14 L12 22" stroke="#121714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="20" font-size="18" font-weight="800" fill="#0C6B3F">수강 과목 편집</text>
  </g>

  <!-- 메인 콘텐츠 그룹 카드 -->
  <g transform="translate(20, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="362" height="760" rx="22" fill="#FFFFFF"/>

    <!-- 학기 요약 박스 -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="326" height="54" rx="14" fill="#E9F3EE"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#656E69">2026학년도 2학기</text>
      <text x="16" y="42" font-size="14" font-weight="800" fill="#121714">현재 수강 등록: <tspan fill="#0C6B3F">총 4과목 (12학점)</tspan></text>
    </g>

    <!-- 과목 추가 버튼 -->
    <g transform="translate(18, 86)">
      <rect x="0" y="0" width="326" height="44" rx="12" fill="#0C6B3F"/>
      <text x="163" y="27" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">+ 과목 추가하기</text>
    </g>

    <!-- 구분선 -->
    <line x1="18" y1="146" x2="344" y2="146" stroke="#F1F3F2" stroke-width="1.5"/>

    <!-- 수강 과목 목록 -->
    <g transform="translate(18, 158)">
      <text x="0" y="16" font-size="14" font-weight="800" fill="#121714">수강 과목 목록</text>

      <!-- 과목 1 -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="326" height="92" rx="14" fill="#F1F3F2"/>
        <rect x="12" y="12" width="34" height="20" rx="6" fill="#E9F3EE"/>
        <text x="29" y="26" font-size="10" font-weight="800" fill="#0C6B3F" text-anchor="middle">전필</text>
        <text x="52" y="27" font-size="14" font-weight="800" fill="#121714">캡스톤디자인 II</text>
        <text x="210" y="27" font-size="11" font-weight="600" fill="#656E69">3학점 · CS0401</text>
        <text x="12" y="52" font-size="12" font-weight="600" fill="#121714">월 02,03 / 수 01</text>
        <text x="12" y="70" font-size="11" fill="#656E69">담당교수: 김서경 교수님</text>
      </g>
    </g>

    <!-- 하단 저장 버튼 -->
    <g transform="translate(18, 688)">
      <rect x="0" y="0" width="326" height="52" rx="16" fill="#0C6B3F"/>
      <text x="163" y="31" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">수강 과목 변경사항 저장하기</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- [3] 과목 추가 방식 선택 모달 (Option Select) -->
  <!-- ========================================== -->

  <!-- 반투명 어두운 배경 (Dim Overlay) -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#121714" fill-opacity="0.48"/>

  <!-- 중앙 옵션 선택 카드 -->
  <g transform="translate(32, 260)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="338" height="310" rx="24" fill="#FFFFFF"/>

    <!-- 헤더 & 닫기 버튼 -->
    <text x="24" y="38" font-size="18" font-weight="800" fill="#121714">과목 추가 방식 선택</text>
    <text x="310" y="36" font-size="18" font-weight="700" fill="#656E69" text-anchor="middle">✕</text>
    
    <text x="24" y="60" font-size="12" font-weight="500" fill="#656E69">원하시는 추가 방식을 선택해 주세요.</text>

    <!-- 옵션 1: 과목 검색으로 추가 -->
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="298" height="84" rx="16" fill="#E9F3EE" stroke="#0C6B3F" stroke-width="1.5"/>
      
      <!-- 아이콘 박스 -->
      <circle cx="36" cy="42" r="22" fill="#FFFFFF"/>
      <text x="36" y="48" font-size="18" text-anchor="middle">🔍</text>

      <text x="72" y="38" font-size="15" font-weight="800" fill="#0C6B3F">과목 검색으로 추가</text>
      <text x="72" y="58" font-size="11" font-weight="600" fill="#656E69">과목명 또는 과목코드로 빠르게 검색</text>

      <!-- 화살표 -->
      <path d="M272 38 L278 42 L272 46" stroke="#0C6B3F" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 옵션 2: 직접 입력으로 추가 -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="298" height="84" rx="16" fill="#F8FAFA" stroke="#E9F3EE" stroke-width="1.5"/>
      
      <!-- 아이콘 박스 -->
      <circle cx="36" cy="42" r="22" fill="#E9F3EE"/>
      <text x="36" y="48" font-size="18" text-anchor="middle">✍️</text>

      <text x="72" y="38" font-size="15" font-weight="800" fill="#121714">직접 입력으로 추가</text>
      <text x="72" y="58" font-size="11" font-weight="500" fill="#656E69">과목명, 요일, 교시 등을 직접 입력</text>

      <!-- 화살표 -->
      <path d="M272 38 L278 42 L272 46" stroke="#121714" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 하단 홈 제스처 바 -->
  <rect x="136" y="860" width="130" height="4" rx="2" fill="#121714"/>
</svg>
