<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874" style="background-color: #F1F3F2; font-family: 'Noto Sans KR', sans-serif;">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C6B3F" />
      <stop offset="100%" stop-color="#259B63" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0C6B3F" flood-opacity="0.08"/>
    </filter>
    <filter id="drawerShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#0C6B3F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 프레임 배경 -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#F1F3F2"/>

  <!-- [1] 상단 헤더 -->
  <g transform="translate(20, 28)">
    <text x="0" y="24" font-size="22" font-weight="900" fill="#0C6B3F" letter-spacing="-0.5">서경 AI 비서</text>

    <!-- 우측 마이/알림 아이콘 -->
    <g transform="translate(288, 4)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="8" r="4" fill="none" stroke="#0C6B3F" stroke-width="2"/>
        <path d="M5 18 A7 7 0 0 1 19 18" fill="none" stroke="#0C6B3F" stroke-width="2"/>
      </g>
      <g transform="translate(32, 0)">
        <path d="M12 3 A6 6 0 0 0 6 9 V14 L4 16 V17 H20 V16 L18 14 V9 A6 6 0 0 0 12 3 Z M10 18 A2 2 0 0 0 14 18" fill="none" stroke="#0C6B3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="4" r="3.5" fill="#259B63"/>
      </g>
    </g>
  </g>

  <!-- [2] 메인 카드 컨테이너 -->
  <g transform="translate(20, 76)" filter="url(#shadow)">
    <rect x="0" y="0" width="362" height="664" rx="24" fill="#FFFFFF"/>

    <!-- 인사말 및 날짜 -->
    <g transform="translate(20, 22)">
      <text x="0" y="22" font-size="18" font-weight="800" fill="#121714">홍길동님,</text>
      <text x="0" y="46" font-size="18" font-weight="800" fill="#121714">오늘 챙길 일이 <tspan fill="#0C6B3F">3개</tspan> 있어요</text>

      <g transform="translate(236, 2)">
        <rect x="0" y="0" width="86" height="30" rx="15" fill="url(#greenGrad)"/>
        <text x="43" y="19" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">10/9(금) ›</text>
      </g>
    </g>

    <!-- [3] 6개 퀵 메뉴 그리드 -->
    <g transform="translate(20, 92)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="#EBF6F0" stroke="#C5E6D5" stroke-width="1"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">🎓</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#0C6B3F" text-anchor="middle">졸업 요건</text>
      </g>

      <g transform="translate(112, 0)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="#E4F2EC" stroke="#B8DFC3" stroke-width="1"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">🔍</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#0C6B3F" text-anchor="middle">분실물</text>
      </g>

      <g transform="translate(224, 0)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="#D8EFE3" stroke="#A8DCC0" stroke-width="1"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">📅</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#0C6B3F" text-anchor="middle">시간표</text>
      </g>

      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="url(#greenGrad)"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF" fill-opacity="0.2"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">💬</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI 채팅</text>
      </g>

      <g transform="translate(112, 84)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="#EBF6F0" stroke="#C5E6D5" stroke-width="1"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">📊</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#0C6B3F" text-anchor="middle">성적 조회</text>
      </g>

      <g transform="translate(224, 84)">
        <rect x="0" y="0" width="98" height="74" rx="18" fill="#CEEAD8" stroke="#9BD5B3" stroke-width="1"/>
        <circle cx="49" cy="24" r="15" fill="#FFFFFF"/>
        <text x="49" y="30" font-size="16" text-anchor="middle">💰</text>
        <text x="49" y="58" font-size="12" font-weight="800" fill="#0C6B3F" text-anchor="middle">장학금</text>
      </g>
    </g>

    <line x1="20" y1="268" x2="342" y2="268" stroke="#E9F3EE" stroke-width="2"/>

    <!-- ========================================== -->
    <!-- [4] 개편된 '오늘 챙길 일' (타임라인 스마트 리스트) -->
    <!-- ========================================== -->
    <g transform="translate(20, 284)">
      <!-- 헤더 -->
      <text x="0" y="16" font-size="16" font-weight="800" fill="#121714">오늘 챙길 일</text>
      <text x="322" y="16" font-size="11" font-weight="700" fill="#0C6B3F" text-anchor="end">전체 보기 ›</text>

      <!-- 타임라인 연결선 -->
      <line x1="16" y1="46" x2="16" y2="216" stroke="#E9F3EE" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- 1. 국가장학금 (D-DAY 긴급) -->
      <g transform="translate(0, 36)">
        <!-- 타임라인 인디케이터 점 -->
        <circle cx="16" cy="20" r="6" fill="#0C6B3F"/>
        <circle cx="16" cy="20" r="10" fill="#0C6B3F" fill-opacity="0.15"/>

        <g transform="translate(36, 0)">
          <!-- D-DAY 뱃지 -->
          <rect x="0" y="2" width="46" height="20" rx="6" fill="#0C6B3F"/>
          <text x="23" y="16" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">D-DAY</text>
          
          <text x="54" y="17" font-size="14" font-weight="800" fill="#121714">국가장학금 2차 신청</text>
          <text x="0" y="38" font-size="12" font-weight="700" fill="#259B63">오늘 18:00 마감</text>
          <text x="286" y="24" font-size="14" font-weight="700" fill="#656E69">›</text>
        </g>
      </g>

      <line x1="36" y1="94" x2="322" y2="94" stroke="#F1F3F2" stroke-width="1"/>

      <!-- 2. 졸업작품 심사 (D-DAY) -->
      <g transform="translate(0, 104)">
        <circle cx="16" cy="20" r="6" fill="#259B63"/>

        <g transform="translate(36, 0)">
          <rect x="0" y="2" width="46" height="20" rx="6" fill="#259B63"/>
          <text x="23" y="16" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">D-DAY</text>
          
          <text x="54" y="17" font-size="14" font-weight="800" fill="#121714">졸업작품 심사 신청</text>
          <text x="0" y="38" font-size="12" font-weight="700" fill="#259B63">오늘 23:59 마감</text>
          <text x="286" y="24" font-size="14" font-weight="700" fill="#656E69">›</text>
        </g>
      </g>

      <line x1="36" y1="162" x2="322" y2="162" stroke="#F1F3F2" stroke-width="1"/>

      <!-- 3. 캡스톤 영수증 제출 (D-6) -->
      <g transform="translate(0, 172)">
        <circle cx="16" cy="20" r="5" fill="#A8DCC0"/>

        <g transform="translate(36, 0)">
          <rect x="0" y="2" width="38" height="20" rx="6" fill="#E9F3EE"/>
          <text x="19" y="16" font-size="10" font-weight="800" fill="#0C6B3F" text-anchor="middle">D-6</text>
          
          <text x="46" y="17" font-size="14" font-weight="800" fill="#121714">캡스톤 영수증 제출</text>
          <text x="0" y="38" font-size="12" font-weight="600" fill="#656E69">10/15(목)까지 학생지원팀</text>
          <text x="286" y="24" font-size="14" font-weight="700" fill="#656E69">›</text>
        </g>
      </g>

    </g>
  </g>

  <!-- [5] 하단 AI 서랍 -->
  <g transform="translate(18, 756)" filter="url(#drawerShadow)">
    <rect x="0" y="0" width="366" height="64" rx="32" fill="url(#greenGrad)"/>
    <circle cx="34" cy="32" r="18" fill="#FFFFFF"/>
    <circle cx="34" cy="32" r="8" fill="none" stroke="#0C6B3F" stroke-width="2"/>
    <line x1="34" y1="26" x2="34" y2="32" stroke="#0C6B3F" stroke-width="2" stroke-linecap="round"/>

    <text x="64" y="30" font-size="14" font-weight="800" fill="#FFFFFF">서경 AI</text>
    <text x="64" y="46" font-size="11" fill="#E9F3EE">위로 밀어서 물어보기</text>

    <path d="M326 36 L332 30 L338 36" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 하단 제스처 바 -->
  <rect x="136" y="860" width="130" height="4" rx="2" fill="#121714"/>
</svg>
