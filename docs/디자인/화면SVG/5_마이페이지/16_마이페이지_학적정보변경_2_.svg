<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" width="402" height="874" style="background-color: #F1F3F2; font-family: 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- [바탕 화면: 입력 화면 레이아웃] -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#F1F3F2"/>

  <g transform="translate(20, 28)">
    <path d="M4 14 L12 6 M4 14 L12 22" stroke="#121714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="20" font-size="18" font-weight="800" fill="#0C6B3F">학적 정보 변경</text>
  </g>

  <g transform="translate(20, 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="362" height="760" rx="22" fill="#FFFFFF"/>
    
    <g transform="translate(18, 24)">
      <text x="0" y="14" font-size="13" font-weight="800" fill="#121714">주전공 *</text>
      <rect x="0" y="22" width="326" height="46" rx="12" fill="#F1F3F2"/>
      <text x="16" y="50" font-size="14" font-weight="700" fill="#121714">소프트웨어학과</text>
    </g>
    
    <g transform="translate(18, 680)">
      <rect x="0" y="0" width="326" height="52" rx="16" fill="#0C6B3F"/>
      <text x="163" y="31" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">학적 정보 변경하기</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- [Dim Overlay & 경고 확인 팝업 모달] -->
  <!-- ========================================== -->

  <!-- 반투명 배경 (Dim Overlay) -->
  <rect x="0" y="0" width="402" height="874" rx="40" fill="#121714" fill-opacity="0.52"/>

  <!-- 팝업 카드 모달 -->
  <g transform="translate(28, 250)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="346" height="340" rx="24" fill="#FFFFFF"/>

    <!-- 경고 아이콘 -->
    <circle cx="173" cy="52" r="26" fill="#E9F3EE"/>
    <text x="173" y="60" font-size="24" text-anchor="middle">⚠️</text>

    <!-- 팝업 타이틀 -->
    <text x="173" y="106" font-size="17" font-weight="800" fill="#121714" text-anchor="middle">학적 정보를 변경하시겠습니까?</text>

    <!-- 변경할 데이터 요약 박스 -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="306" height="66" rx="12" fill="#F1F3F2"/>
      <text x="153" y="26" font-size="13" font-weight="800" fill="#0C6B3F" text-anchor="middle">소프트웨어학과 (4학년 2학기 재학)</text>
      <text x="153" y="46" font-size="12" font-weight="700" fill="#656E69" text-anchor="middle">부전공: 경영학부</text>
    </g>

    <!-- 주의/경고 문구 -->
    <g transform="translate(20, 204)">
      <text x="153" y="14" font-size="12" font-weight="700" fill="#121714" text-anchor="middle">위 정보가 본인의 실제 학적 정보와 일치합니까?</text>
      <text x="153" y="32" font-size="11" font-weight="500" fill="#B93C0A" text-anchor="middle">※ 잘못된 학적 정보 입력 시 과목 추천, 졸업 요건 계산 및</text>
      <text x="153" y="48" font-size="11" font-weight="500" fill="#B93C0A" text-anchor="middle">AI 시스템 전체 안내 서비스에서 에러가 발생할 수 있습니다.</text>
    </g>

    <!-- 팝업 액션 버튼 -->
    <g transform="translate(20, 268)">
      <rect x="0" y="0" width="100" height="48" rx="12" fill="#F1F3F2"/>
      <text x="50" y="29" font-size="14" font-weight="700" fill="#656E69" text-anchor="middle">취소</text>

      <rect x="108" y="0" width="198" height="48" rx="12" fill="#0C6B3F"/>
      <text x="207" y="29" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">확인 및 변경 완료</text>
    </g>
  </g>

  <!-- 하단 홈 제스처 바 -->
  <rect x="136" y="860" width="130" height="4" rx="2" fill="#121714"/>
</svg>
